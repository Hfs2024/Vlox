<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlox Light in NS</title>
    <link rel="stylesheet" href="/css/elements.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/posts.css" />
    <link rel="stylesheet" href="/css/taskbar.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.8/purify.min.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/monokai-sublime.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>

<body>
    <header>
        <a href="/" class="logo">Vlox</a>
        <div class="center">
            <i class="fas fa-user-plus helper-icon" id="signup-btn" role="button" tabindex="0" title="Signup"></i>
            <div id="loggedIn-group">
                <i class="fas fa-user-circle helper-icon" id="profile-btn" role="button" tabindex="0"
                    title="Profile"></i>
                <i class="fas fa-vault helper-icon" id="private-posts-btn" role="button" tabindex="0" title="Private Posts"></i>
                <i class="fas fa-bookmark helper-icon" id="post-bookmarks-btn" role="button" tabindex="0" title="Bookmark Posts"></i>
                <i class="fas fa-sign-out  helper-icon" id="signout-btn" role="button" tabindex="0" title="Signout"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="left">
            <h1>What's on your mind today?</h1>
            <div id="create-container">
                <input id="create-post-title" type="text" placeholder="Enter post title..." />
                <input id="create-post-keywords" type="text" placeholder="Enter post keywords (Comma-separated)..." />
                <textarea id="create-post-content" placeholder="Enter post content..."></textarea>
            </div>
            <div id="create-preview-container" class="post-preview overflow"></div>

            <div class="space-between">
                <div class="center" style="gap: 5px;">
                    <i id="copy-post-content-btn" class="fas fa-copy helper-icon" role="button" tabindex="0"
                        title="Copy"></i>
                    <i id="clear-post-content-btn" class="fas fa-eraser helper-icon" role="button" tabindex="0"
                        title="Clear"></i>
                    <i id="create-spoilers-btn" class="fa-solid fa-circle-exclamation helper-icon" role="button"
                        tabindex="0" title="Spoilers"></i>
                    <i id="create-preview-mode" class="fas fa-columns helper-icon" role="button" tabindex="0"
                        title="Peview toggle"></i>
                    <i id="view-active-gifts" class="fas fa-gift helper-icon" role="button" tabindex="0"
                        title="View active gifts"></i>
                </div>
                <p class="count-text-wrapper">
                    Count:
                    <span class="count" id="create-post-content-count">0/2000</span>
                </p>
            </div>

            <button id="create-post-btn" class="w-full">Create post</button>
        </section>

        <section class="right">
            <div class="center" style="margin-bottom: 20px;">
                <input class="w-full" placeholder="Search by keywords... (Top 100 results only)" id="search-posts-input"/>
                <button id="search-posts-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div id="posts-container">
                <!--Posts will be loaded here -->
            </div>

            <div class="center">
                <button id="prev-btn">
                    <i class="fas fa-chevron-left"></i>
                    Prev
                </button>

                <button id="next-btn">
                    <i class="fas fa-chevron-right"></i>
                    Next
                </button>
            </div>
        </section>

        <button id="change-theme-btn">
            <i class="fas fa-paint-roller"></i>
        </button>
    </main>

    <footer>
        <p>&copy; 2026 Vlox</p>
    </footer>

    <!-- JavaScript -->
    <script src="nanoscript.min.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/render-posts.js"></script>
    <script src="js/bookmarks.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/plugins/ghost-state.js"></script>
    <script src="js/create-post.js"></script>
    <script src="js/private-posts.js"></script>
    <script src="js/render-profile-post.js"></script>
    <script src="js/signup.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/gifts.js"></script>
    <script src="js/plugins/live-counter.js"></script>
    <script src="js/plugins/copy.js"></script>
</body>

</html>
